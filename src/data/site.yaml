# Research areas grid. Keep each description to one or two sentences.
research:
  - title: Certificate & TLS analysis
    description: Building and validating certificate chains, checking trust, revocation, Certificate Transparency and algorithm strength.
  - title: HTTP security headers
    description: Measuring adoption and correctness of headers such as HSTS, CSP and related browser protections.
  - title: HTTPS configuration
    description: Assessing protocol versions, cipher suites and server configuration against current best practice.
  - title: Vulnerability scanning
    description: Identifying services exposed to known vulnerabilities across large sets of hosts.

